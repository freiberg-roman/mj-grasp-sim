# Clean grasp centers config
# Mirrors style of other CLI configs.

defaults:
  - _self_
  - gripper: shadow # default; override via +gripper=<allegro|dexee|shadow>

dry_run: false # set true to only report counts
min_scene_grasps: 50 # delete scene if remaining grasps < this (ignored if buffer-excluded)

hydra:
  job:
    chdir: False
